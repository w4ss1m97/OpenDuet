[package]
name = "duet-desktop"
version = "0.1.0"
description = "Duet desktop shell"
edition = "2021"

[lib]
name = "duet_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "duet-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
libc = "0.2"
